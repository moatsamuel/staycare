<main class="flex-1 p-6 max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">My Registered Appointments</h2>
                        <p class="text-xs text-slate-400 mt-0.5">see your scheduled appointment</p>
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="border-b border-slate-200 text-slate-400 font-bold text-xs uppercase tracking-wider">
                                <th class="pb-3">Assigned Practitioner</th>
                                <th class="pb-3">Consultation Schedule</th>
                                <th class="pb-3 text-right">Status Code</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-slate-700">
                            <tr class="hover:bg-slate-50/50 transition">
                                <td class="py-4 font-medium flex items-center space-x-3">
                                    <span class="text-sky-500 text-lg">🩺</span>
                                    <div>
                                        <p class="text-slate-800 font-bold">Dr. Suliat Ramotu</p>
                                        <p class="text-xs text-sky-600">Cardiology Department (ID: 104)</p>
                                    </div>
                                </td>
                                <td class="py-4 text-slate-500 font-mono">2026-10-24 @ 10:00 AM</td>
                                <td class="py-4 text-right">
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-green-100 text-green-800 shadow-sm">Confirmed</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-fit">
            <div class="mb-5 border-b border-slate-100 pb-3">
                <h2 class="text-lg font-bold text-slate-800">Book New Visit</h2>
                <p class="text-xs text-slate-400">Select desirable options</p>
            </div>
            
            <form onsubmit="event.preventDefault(); alert('Appointment request made successfully');" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">1. Choose Clinic Area (Specialty ID)</label>
                    <select class="w-full p-3 border border-slate-300 rounded-xl bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                        <option value="1">Cardiology (Heart Care)</option>
                        <option value="2">General Medicine</option>
                        <option value="3">Pediatrics (Child Health)</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">2. Assign Medical Personnel (Doctor ID)</label>
                    <select class="w-full p-3 border border-slate-300 rounded-xl bg-white text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                        <option value="104">Dr. Suliat Ramotu</option>
                        <option value="105">Dr. Alex Christopher</option>
                        <option value="105">Dr. Donald Kane</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">3. Selection Target</label>
                    <input type="datetime-local" required class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>
                
                <button type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white text-sm font-bold rounded-xl shadow-md transition-all duration-150 transform active:scale-95">
                    Create schedule
                </button>
            </form>
        </div>
    </main>
